<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alejandro Nava de León · RAL Ventas</title>
  <meta name="description" content="Tarjeta de presentación de Alejandro Nava de León, Departamento de Ventas de RAL.">
  <link rel="icon" href="logo-ral.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Colores tomados del logo de RAL */
    :root {
      --brand: #E9212B;
      --brand-dark: #B3141C;
      --ink: #F2F2F2;
      --muted: #A0A0A0;
      --card: #1E2221;
      --bg: #0B0C0E;
      --whatsapp: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(233, 33, 43, .18), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(100, 100, 100, .18), transparent 45%),
        var(--bg);
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
      border: 1px solid #2C3130;
      display: grid;
      grid-template-columns: 36% 1fr;
    }
    .card__brand {
      background: #06070A; /* mismo negro que el fondo del logo */
      display: grid;
      place-items: center;
      padding: 28px 20px;
    }
    .card__brand img {
      width: 100%;
      max-width: 180px;
    }
    .card__info {
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      border-left: 6px solid var(--brand);
    }
    .name {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .role {
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--brand);
    }
    .divider {
      width: 48px;
      height: 4px;
      background: var(--brand);
      border-radius: 2px;
      margin: 14px 0;
    }
    .phone {
      color: var(--muted);
      font-size: .95rem;
      text-decoration: none;
    }
    .phone:hover { color: var(--ink); }
    .btn-wa {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      white-space: nowrap;
      border-radius: 999px;
      background: var(--whatsapp);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(37, 211, 102, .35);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-wa:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(37, 211, 102, .45); }
    .btn-wa:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .btn-wa svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }

    @media (max-width: 520px) {
      .card { grid-template-columns: 1fr; }
      .card__brand { padding: 24px 20px; }
      .card__brand img { max-width: 150px; }
      .card__info { text-align: center; align-items: center; border-left: 0; border-top: 6px solid var(--brand); }
      .btn-wa { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="card__brand">
      <img src="logo-ral.jpg" alt="Logo de RAL">
    </div>
    <div class="card__info">
      <h1 class="name">Alejandro Nava de León</h1>
      <p class="role">Departamento de Ventas</p>
      <span class="divider" aria-hidden="true"></span>
      <a class="phone" href="tel:84417800221">844 1780 0221</a>
      <a class="btn-wa" href="https://wa.me/5284417800221?text=Hola%20Alejandro%2C%20me%20interesa%20recibir%20informaci%C3%B3n." target="_blank" rel="noopener">

    </div>
  </main>
</body>
</html>
